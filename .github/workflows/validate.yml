name: Validate Trend Engine v0.08.8.2

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile active Python modules
        run: |
          python -m py_compile app.py
          python -m py_compile MK_Trend_Following_Engine_v001.py
          python -m py_compile MK_Trend_Following_Decision_Engine_v002.py
          python -m py_compile MK_Trend_Following_Universe_v0087.py
          python -m py_compile MK_Institutional_Risk_Analytics_v0087.py
          python -m py_compile MK_Trend_Following_Entry_Gate_v005.py
          python -m py_compile MK_Trend_Following_Risk_Analytics_v003.py
          python -m py_compile MK_Trend_Following_HTML_Report_v003.py
          python -m py_compile MK_Nadaraya_Watson_Trend_v0087.py
          python -m py_compile MK_Nadaraya_Watson_Visuals_v0087.py
          python -m py_compile MK_Nadaraya_Watson_HTML_Report_v0087.py
          python -m py_compile MK_Benchmark_Relative_v0087.py
          python -m py_compile MK_Institutional_Tactical_v0086.py
          python -m py_compile MK_Intraday_Tactical_Lab_v0088.py
          python -m py_compile MK_Intraday_Visuals_v0088.py
          python -m py_compile MK_Tactical_Visual_Governance_v00882.py
          python -m py_compile MK_Yahoo_Original_Fetch_v0085.py

      - name: Golden Master regression
        run: python smoke_test.py

      - name: Yahoo rate-limit stability regression
        run: python yahoo_rate_limit_validation_v00852.py

      - name: Tactical accounting integrity
        run: python tactical_accounting_validation_v0086.py

      - name: Tactical chart and surface integrity
        run: python tactical_surface_validation_v0086.py

      - name: Plotly unique-key regression
        run: python plotly_unique_key_validation_v00853.py

      - name: Intraday Tactical Lab v0.08.8
        run: python intraday_tactical_validation_v0088.py

      - name: Intraday visibility and 15m surface v0.08.8.2
        run: |
          python -m py_compile app.py MK_Intraday_Visuals_v0088.py
          python intraday_visibility_validation_v00881.py

      - name: Tactical Envelope non-overlap visual governance v0.08.8.2
        run: |
          python -m py_compile app.py MK_Tactical_Visual_Governance_v00882.py
          python tactical_envelope_layout_validation_v00882.py

      - name: Streamlit headless cold-start smoke test
        shell: bash
        run: |
          set -e
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null; then
              echo "PASS — Streamlit health endpoint is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Crypto Copper NW visual validation v0.08.7
        run: |
          python -m py_compile app.py MK_Trend_Following_Universe_v0087.py MK_Benchmark_Relative_v0087.py MK_Nadaraya_Watson_Trend_v0087.py MK_Nadaraya_Watson_Visuals_v0087.py MK_Nadaraya_Watson_HTML_Report_v0087.py MK_Institutional_Risk_Analytics_v0087.py
          python crypto_copper_nw_validation_v0087.py
          python surface_validation_v0087.py
