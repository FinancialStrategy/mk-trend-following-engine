name: Validate Trend Engine

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  golden-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py
          python -m py_compile MK_Trend_Following_Engine_v001.py
          python -m py_compile MK_Trend_Following_Decision_Engine_v002.py
          python -m py_compile MK_Trend_Following_Universe_v002.py
          python -m py_compile MK_Trend_Following_HTML_Report_v002.py
          python -m py_compile MK_Trend_Following_HTML_Report_v003.py
          python -m py_compile MK_Trend_Following_Risk_Analytics_v003.py
          python -m py_compile MK_Trend_Following_Risk_Analytics_v004.py
          python -m py_compile MK_Trend_Following_Entry_Gate_v005.py

      - name: Golden Master validation
        run: python smoke_test.py

      - name: v0.02 decision/report integration test
        run: |
          python - <<'PY'
          from pathlib import Path
          from MK_Trend_Following_Engine_v001 import EngineConfig, load_legacy_golden_csv, run_legacy_engine
          from MK_Trend_Following_Decision_Engine_v002 import decision_snapshot, trade_ledger
          from MK_Trend_Following_HTML_Report_v002 import build_html
          g=load_legacy_golden_csv('MK_Trend_Following_Legacy_Golden_Master_GE_1988_2008.csv')
          m=g.rename(columns={'AdjClose':'Adj Close'})[['Open','High','Low','Close','Volume','Adj Close']]
          cfg=EngineConfig()
          r=run_legacy_engine(m,cfg,validate=False)
          d=decision_snapshot(r,cfg)
          assert d['decision'] in {'BUY','HOLD','SELL','WAIT / CASH'}
          html=build_html(r,cfg,ticker='GE',instrument_name='Golden Master',market_label='Legacy Test',source_note='Offline Golden Master')
          assert 'Decision & Causality' in html
          assert 'Interactive Price' in html
          print('PASS — v0.02 decision/report integration')
          PY

      - name: Rolling risk source-separation validation
        run: python risk_analytics_test_v003.py

      - name: Flat-line presentation validation v0.04
        run: python risk_flat_line_test_v004.py

      - name: Entry gate governance validation v0.05
        run: python entry_gate_test_v005.py
